_schema-version: "3.3"
ID: kopran-qtr-label-prod
version: 1.0.0
description: "CAP + React Fullstack App"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --prefix backend
        - rm -rf backend/node_modules/@types/sap__cds
        - npx --prefix backend cds build --production

modules:
  - name: qtr-label-backend-srv-prd
    type: nodejs
    path: backend
    parameters:
      buildpack: nodejs_buildpack
      memory: 350M
      env:
        API_USER: "rakeshdoshi@kopran.com"
        API_PASS: "Keepgrowing@25"
    build-parameters:
      builder: custom
      commands:
        - npm install --omit=dev
        - cds build --production
    provides:
      - name: qtr-label-srv-api-prd
        properties:
          srv-url: ${default-url}
    requires:
      - name: qtr-label-destination-prd
      - name: qtr-label-html5-runtime-prd
      - name: xsuaa-kopran-qtr-label-prod

  - name: qtr-label-frontend-prd
    type: html5
    path: app/build
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []
    requires:
      - name: qtr-label-html5-host-prd

  - name: qtr-label-frontend-deployer-prd
    type: com.sap.application.content
    path: app/frontend-deployer
    requires:
      - name: qtr-label-html5-host-prd
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - build/**
          name: qtr-label-frontend-prd

  - name: qtr-label-approuter-prd
    type: nodejs
    path: approuter
    parameters:
      memory: 300M
      disk-quota: 650M
      keep-existing-routes: true
      env:
        TENANT_HOST_PATTERN: "^(.*)--kopran-ltd-subaccount-t506bu9i-qtr-label-approuter-prd.cfapps.eu10-005.hana.ondemand.com"
    requires:
      - name: qtr-label-html5-runtime-prd
        properties:
          name: qtr-label-html5-runtime-prd
          url: https://html5-apps-repo.cfapps.eu10.hana.ondemand.com
          forwardAuthToken: true
      - name: qtr-label-html5-host-prd
      - name: qtr-label-destination-prd
      - name: xsuaa-kopran-qtr-label-prod
      - name: qtr-label-srv-api-prd
        group: destinations
        properties:
          name: qtr-label-srv-api-prd
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: qtr-label-destination-prd
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: qtr-label-html5-runtime-prd
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: qtr-label-html5-host-prd
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: xsuaa-kopran-qtr-label-prod
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      config-path: ./xs-security.json
      config:
        xsappname: "kopran-qtr-label-prod-app"
        tenant-mode: shared
        oauth2-configuration:
          redirect-uris:
            - "https://kopran-ltd--kopran-ltd-subaccount-t506bu9i-qtr-label-approuter-prd.cfapps.eu10-005.hana.ondemand.com/**"
